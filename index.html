<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, height=device-height, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<title>Melanie's Mansion of Mayhem</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	height: 100dvh;
	overflow: hidden;
	overscroll-behavior: none;
	background-color: #241424;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-tap-highlight-color: transparent;
}

body {
	color: white;
}

#canvas {
	display: block;
	width: 100%;
	height: 100%;
	touch-action: none;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #3a2744;
	border-radius: 0.5rem;
	border: 2px solid #f0c56a;
	color: #fff3e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 1.05rem;
	line-height: 1.35;
	margin: 0 1.25rem;
	overflow: auto;
	max-height: 70%;
	padding: 1rem;
	text-align: left;
	white-space: pre-wrap;
	z-index: 2;
}

#boot-error {
	display: none;
	position: fixed;
	left: 0.75rem;
	right: 0.75rem;
	bottom: 0.75rem;
	z-index: 5;
	background: #3a2744;
	color: #fff3e0;
	border: 2px solid #f0c56a;
	border-radius: 0.75rem;
	padding: 0.85rem 1rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 1rem;
	line-height: 1.35;
	white-space: pre-wrap;
	max-height: 45%;
	overflow: auto;
}

#boot-error.show {
	display: block;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<div id="boot-error" role="alert"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":34943172,"index.wasm":16838841},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	const bootError = document.getElementById('boot-error');
	let lastEngineError = '';

	function showBootError(message) {
		const text = String(message || lastEngineError || 'The game did not start.');
		lastEngineError = text;
		bootError.textContent = text;
		bootError.classList.add('show');
	}

	function displayFailureNotice(err) {
		console.error(err);
		let text = 'An unknown error occurred.';
		if (err instanceof Error) {
			text = err.message;
		} else if (typeof err === 'string') {
			text = err;
		}
		if (lastEngineError && text.indexOf(lastEngineError) === -1) {
			text += '\n' + lastEngineError;
		}
		showBootError(text);
		setStatusNotice(text);
		setStatusMode('notice');
		initializing = false;
	}

	window.addEventListener('error', (event) => {
		if (!initializing) {
			return;
		}
		showBootError(event.message || 'A script error stopped the game.');
	});
	window.addEventListener('unhandledrejection', (event) => {
		if (!initializing) {
			return;
		}
		const reason = event.reason;
		showBootError(reason && reason.message ? reason.message : String(reason));
	});

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		let downloadFinishedAt = 0;
		const bootWatch = setInterval(() => {
			if (!initializing) {
				clearInterval(bootWatch);
				bootError.classList.remove('show');
				return;
			}
			if (downloadFinishedAt && Date.now() - downloadFinishedAt > 45000) {
				showBootError(lastEngineError
					? 'Still starting after the download finished.\n' + lastEngineError
					: 'Still starting after the download finished. This phone may have run out of memory while loading the game.');
			}
		}, 1000);
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					if (current >= total) {
						downloadFinishedAt = downloadFinishedAt || Date.now();
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
			'onPrint': function () {
				console.log.apply(console, arguments);
			},
			'onPrintError': function () {
				const text = Array.prototype.join.call(arguments, ' ');
				console.error(text);
				if (text) {
					lastEngineError = text;
					if (initializing) {
						showBootError(text);
					}
				}
			},
		}).then(() => {
			clearInterval(bootWatch);
			bootError.classList.remove('show');
			setStatusMode('hidden');
		}, (err) => {
			clearInterval(bootWatch);
			displayFailureNotice(err);
		});
	}
}());
		</script>
	</body>
</html>
